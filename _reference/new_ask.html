<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#D9D5CC; font-family:'Nunito',system-ui,sans-serif; padding:40px; display:flex; gap:44px; justify-content:center; align-items:flex-start; }
  .phone { width:390px; min-height:844px; border-radius:46px; overflow:hidden; position:relative; background:#F1EDE3; color:#1E1E1E; box-shadow:0 30px 80px rgba(0,0,0,.25); }
  .statusbar { position:absolute; top:20px; left:28px; right:28px; display:flex; justify-content:space-between; font-size:13px; font-weight:700; z-index:3; }
  .hdr { position:absolute; top:54px; left:0; right:0; height:52px; display:flex; align-items:center; gap:12px; padding:0 20px; z-index:3; }
  .back { width:38px; height:38px; border-radius:50%; background:#FBFAF7; display:flex; align-items:center; justify-content:center; }
  .hdr .ti { font-family:Georgia,serif; font-size:19px; font-weight:700; }
  .hdr .avatar { width:30px; height:30px; }

  .body { position:absolute; top:112px; left:0; right:0; bottom:0; padding:0 20px 110px; overflow:hidden; }

  /* welcome */
  .welcome { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-bottom:40px; }
  .welcome svg.hero { width:158px; height:158px; }
  .welcome h2 { font-family:Georgia,serif; font-size:26px; font-weight:700; margin-top:2px; }
  .welcome p { color:#5A5A5A; font-size:14.5px; margin-top:8px; max-width:250px; line-height:1.5; }
  .chips { margin-top:26px; display:flex; flex-direction:column; gap:10px; width:100%; }
  .chip { background:#FBFAF7; border:1px solid #E6E0D3; border-radius:16px; padding:14px 16px; font-size:14.5px; font-weight:600; color:#33402f; text-align:left; display:flex; align-items:center; gap:10px; }
  .chip svg { flex:0 0 auto; }

  /* conversation */
  .msgs { display:flex; flex-direction:column; gap:16px; padding-top:6px; }
  .row { display:flex; gap:10px; align-items:flex-end; }
  .row.user { justify-content:flex-end; }
  .av { width:34px; height:34px; flex:0 0 auto; margin-bottom:2px; }
  .bubble { max-width:76%; padding:13px 16px; border-radius:20px; font-size:14.5px; line-height:1.5; }
  .bubble.echo { background:#FBFAF7; border-bottom-left-radius:6px; }
  .bubble.user { background:#1E1E1E; color:#F1EDE3; border-bottom-right-radius:6px; }
  .bubble b { color:#2C6E3A; font-weight:800; } .bubble.user b { color:#9Fe0ab; }
  .sources { margin-top:10px; display:inline-flex; align-items:center; gap:6px; background:#EDF4E9; color:#3f7a4f; font-size:11.5px; font-weight:800; letter-spacing:.4px; padding:5px 10px; border-radius:20px; }
  .typing { display:flex; align-items:center; gap:10px; }
  .typing .t { background:#EDF4E9; color:#3f7a4f; font-size:13.5px; font-weight:700; font-style:italic; padding:9px 15px; border-radius:18px; border-bottom-left-radius:6px; }

  /* input */
  .input { position:absolute; bottom:22px; left:16px; right:16px; display:flex; align-items:center; gap:10px; background:#FBFAF7; border:1px solid #E6E0D3; border-radius:28px; padding:8px 8px 8px 20px; z-index:3; box-shadow:0 8px 26px rgba(60,72,64,.08); }
  .input .ph { flex:1; color:#9a9384; font-size:15px; }
  .send { width:46px; height:46px; border-radius:50%; background:#49884F; display:flex; align-items:center; justify-content:center; }
  h3.lbl { text-align:center; font-family:Georgia,serif; margin-bottom:16px; color:#4a4a44; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="orb" cx="45%" cy="57%" r="60%">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="30%" stop-color="#F4F9F0"/>
    <stop offset="60%" stop-color="#D9E8DB"/><stop offset="84%" stop-color="#B4D1BA"/><stop offset="100%" stop-color="#9EC0A6"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#D6EBDA" stop-opacity=".9"/><stop offset="100%" stop-color="#D6EBDA" stop-opacity="0"/></radialGradient>
  <radialGradient id="spec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="bs" cx="50%" cy="80%" r="55%"><stop offset="0%" stop-color="#5E8568" stop-opacity="0"/><stop offset="72%" stop-color="#5E8568" stop-opacity="0"/><stop offset="100%" stop-color="#5E8568" stop-opacity=".3"/></radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity=".92"/><stop offset="46%" stop-color="#D8EADC" stop-opacity=".6"/><stop offset="100%" stop-color="#98BEA2" stop-opacity=".3"/></linearGradient>
  <filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft2" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8"/></filter>
</defs></svg>

<script>
function orb(opts){ const {rings=false, band=false} = opts||{};
  const back = band ? `<path d="M44 104 A 82 33 -18 0 1 196 140" fill="none" stroke="url(#sheen)" stroke-width="15" opacity=".45" filter="url(#soft2)"/>` :
    (rings ? `<g fill="none" stroke="url(#sheen)" filter="url(#soft2)">
       <circle cx="120" cy="120" r="72" stroke-width="11" opacity=".8"/><circle cx="120" cy="120" r="88" stroke-width="11" opacity=".5"/></g>` : '');
  const front = band ? `<path d="M196 140 A 82 33 -18 0 1 44 104" fill="none" stroke="url(#sheen)" stroke-width="17" opacity=".85" filter="url(#soft2)"/>` : '';
  const eyes = band ? `<g stroke="#222f27" stroke-width="3" fill="none" stroke-linecap="round"><path d="M101 120 Q108 127 115 120"/><path d="M125 120 Q132 127 139 120"/></g>`
    : `<ellipse cx="108" cy="120" rx="5.5" ry="8.5" fill="#222f27"/><ellipse cx="132" cy="120" rx="5.5" ry="8.5" fill="#222f27"/>`;
  return `<circle cx="120" cy="122" r="92" fill="url(#glow)" filter="url(#soft)"/>${back}
    <circle cx="120" cy="120" r="56" fill="url(#orb)"/><circle cx="120" cy="120" r="56" fill="url(#bs)"/>
    <ellipse cx="100" cy="94" rx="24" ry="15" fill="url(#spec)" filter="url(#soft2)" transform="rotate(-24 100 94)"/>
    <circle cx="98" cy="90" r="5" fill="#fff" opacity=".95" filter="url(#soft2)"/>${eyes}${front}`;}
function svgOrb(cls,opts){ return `<svg class="${cls}" viewBox="0 0 240 240">${orb(opts)}</svg>`;}

const status = `<div class="statusbar"><span>9:41</span><span>&#9679;&#9679;&#9679; &#128246; 34</span></div>`;
const backIco = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1E1E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
const sendIco = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12h11M13 6l6 6-6 6"/></svg>`;
const sparkIco = `<svg width="16" height="16" viewBox="0 0 22 22" fill="#7FB48C"><path d="M11 2l1.6 5.4L18 9l-5.4 1.6L11 16l-1.6-5.4L4 9l5.4-1.6z"/></svg>`;

// ── Welcome state ──
const welcome = `
  ${status}
  <div class="hdr"><div class="back">${backIco}</div><div class="ti">Ask Echo</div></div>
  <div class="body"><div class="welcome">
    ${svgOrb('hero',{rings:true})}
    <h2>How can I help, Chandan?</h2>
    <p>Ask about your schedule, messages, or anything in your local vault.</p>
    <div class="chips">
      <div class="chip">${sparkIco} What's on my schedule today?</div>
      <div class="chip">${sparkIco} Any messages from work I missed?</div>
      <div class="chip">${sparkIco} Summarize my notifications</div>
    </div>
  </div></div>
  <div class="input"><div class="ph">Ask Echo anything…</div><div class="send">${sendIco}</div></div>`;

// ── Conversation state ──
const convo = `
  ${status}
  <div class="hdr"><div class="back">${backIco}</div>${svgOrb('avatar',{})}<div class="ti">Echo</div></div>
  <div class="body"><div class="msgs">
    <div class="row user"><div class="bubble user">What's on my schedule today?</div></div>
    <div class="row">
      ${svgOrb('av',{})}
      <div class="bubble echo">You've got a <b>10 AM standup</b> and a <b>dentist appointment at 4:30 PM</b>. Priya also shared the <b>Q3 Figma links</b> for review.
        <div class="sources">${sparkIco} 3 sources</div>
      </div>
    </div>
    <div class="row user"><div class="bubble user">Anything urgent from work?</div></div>
    <div class="row">
      ${svgOrb('av',{band:true})}
      <div class="typing"><div class="t">Echo is thinking…</div></div>
    </div>
  </div></div>
  <div class="input"><div class="ph">Ask Echo anything…</div><div class="send">${sendIco}</div></div>`;

document.write(`
 <div><h3 class="lbl">Welcome</h3><div class="phone">${welcome}</div></div>
 <div><h3 class="lbl">Conversation</h3><div class="phone">${convo}</div></div>
`);
</script>
</body>
</html>
