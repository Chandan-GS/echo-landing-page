<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:'Nunito',sans-serif;overflow:hidden;
  background:radial-gradient(120% 130% at 78% 20%, #2b4a30 0%, #1c3321 40%, #141810 100%);color:#EFEFEF;
  display:flex;align-items:center;padding:0 76px;gap:44px;position:relative}
.rings{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:640px;height:640px;opacity:.5}
.left{position:relative;z-index:2;max-width:640px}
.kick{font-size:20px;letter-spacing:5px;font-weight:800;color:#8FD69B;text-transform:uppercase}
h1{font-family:'Old Standard TT',serif;font-size:92px;line-height:.98;font-weight:700;margin:20px 0 6px;letter-spacing:-1px}
h1 em{font-style:italic;color:#AECFB4}
p{font-size:27px;line-height:1.4;color:#CBD8C6;max-width:560px;margin-top:14px}
.badge{margin-top:34px;display:inline-flex;align-items:center;gap:12px;background:#EFEFEF;color:#141810;
  font-weight:800;font-size:22px;padding:15px 26px;border-radius:16px}
.dot{width:11px;height:11px;border-radius:50%;background:#6EBC76;box-shadow:0 0 14px #6EBC76}
.orb{position:relative;z-index:2;width:340px;height:340px;flex:0 0 auto}
</style></head><body>
<svg class="rings" viewBox="0 0 240 240" aria-hidden="true">
  <g fill="none" stroke="#6EBC76" stroke-width="1.4" opacity=".22">
    <circle cx="120" cy="120" r="60"/><circle cx="120" cy="120" r="90"/><circle cx="120" cy="120" r="118"/>
  </g>
</svg>
<div class="left">
  <div class="kick">Your private morning briefing</div>
  <h1>Meet <em>Echo</em>.</h1>
  <p>It captures your notifications, messages and calendar — then reads you a calm spoken briefing. On-device. Private by default.</p>
  <div class="badge"><span class="dot"></span> Now on Google Play</div>
</div>
<svg class="orb" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Echo mascot">
  <defs>
    <radialGradient id="em-orb" cx="45%" cy="57%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="30%" stop-color="#F4F9F0"/>
      <stop offset="60%" stop-color="#D9E8DB"/><stop offset="84%" stop-color="#B4D1BA"/><stop offset="100%" stop-color="#9EC0A6"/>
    </radialGradient>
    <radialGradient id="em-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6EBC76" stop-opacity=".55"/><stop offset="100%" stop-color="#6EBC76" stop-opacity="0"/></radialGradient>
    <radialGradient id="em-spec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="em-bs" cx="50%" cy="80%" r="55%"><stop offset="0%" stop-color="#5E8568" stop-opacity="0"/><stop offset="72%" stop-color="#5E8568" stop-opacity="0"/><stop offset="100%" stop-color="#5E8568" stop-opacity=".3"/></radialGradient>
    <linearGradient id="em-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity=".92"/><stop offset="46%" stop-color="#D8EADC" stop-opacity=".6"/><stop offset="100%" stop-color="#98BEA2" stop-opacity=".3"/></linearGradient>
    <filter id="em-soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="em-soft2" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>
  <circle cx="120" cy="122" r="98" fill="url(#em-glow)" filter="url(#em-soft)"/>
  <g fill="none" stroke="url(#em-sheen)" filter="url(#em-soft2)">
    <circle cx="120" cy="120" r="72" stroke-width="11" opacity=".8"/><circle cx="120" cy="120" r="88" stroke-width="11" opacity=".5"/><circle cx="120" cy="120" r="104" stroke-width="11" opacity=".3"/>
  </g>
  <circle cx="120" cy="120" r="56" fill="url(#em-orb)"/><circle cx="120" cy="120" r="56" fill="url(#em-bs)"/>
  <ellipse cx="100" cy="94" rx="24" ry="15" fill="url(#em-spec)" filter="url(#em-soft2)" transform="rotate(-24 100 94)"/>
  <circle cx="98" cy="90" r="5" fill="#fff" opacity=".95" filter="url(#em-soft2)"/>
  <ellipse cx="108" cy="120" rx="5.5" ry="8.5" fill="#222f27"/><ellipse cx="132" cy="120" rx="5.5" ry="8.5" fill="#222f27"/>
</svg>
</body></html>
