<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>

  body { background:transparent !important; padding:0 !important; margin:0 !important; display:block !important; }
  .phone { box-shadow:none !important; margin:0 !important; }

  .greet,.primary .t,.card .ct,h3.lbl { font-family:'Old Standard TT',Georgia,serif !important; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#D9D5CC; font-family:'Nunito',system-ui,sans-serif; padding:40px; display:flex; gap:44px; justify-content:center; align-items:flex-start; }
  .phone { width:390px; min-height:844px; border-radius:46px; overflow:hidden; position:relative;
           box-shadow:0 30px 80px rgba(0,0,0,.25); }
  .light { background:#F1EDE3; color:#1E1E1E; }
  .dark  { background:#141810; color:#EFEFEF; }
  .screen { padding:58px 22px 118px; display:flex; flex-direction:column; }
  .statusbar { position:absolute; top:20px; left:28px; right:28px; display:flex; justify-content:space-between; font-size:13px; font-weight:700; z-index:2; }
  .dark .statusbar { color:#EFEFEF; } .light .statusbar { color:#1E1E1E; }

  /* hero */
  .hero { display:flex; flex-direction:column; align-items:center; margin-top:8px; }
  .hero svg { width:200px; height:200px; }
  .greet { font-family:Georgia,'Old Standard TT',serif; font-size:29px; font-weight:700; text-align:center; margin-top:4px; letter-spacing:-.3px; }
  .sub { font-size:14.5px; text-align:center; margin-top:6px; }
  .light .sub { color:#5A5A5A; } .dark .sub { color:#A6AEA0; }

  .caption { font-size:11px; letter-spacing:1.8px; font-weight:800; text-transform:uppercase; margin:0 4px 10px; }
  .light .caption { color:#9A937F; } .dark .caption { color:#788672; }

  /* primary card */
  .primary { border-radius:26px; padding:20px 22px; display:flex; align-items:center; justify-content:space-between; }
  .light .primary { background:#1E1E1E; color:#F1EDE3; }
  .dark .primary  { background:#EDF4E9; color:#141810; }
  .primary .t { font-family:Georgia,serif; font-size:21px; font-weight:700; }
  .primary .s { font-size:13px; opacity:.7; margin-top:3px; }
  .pbtn { width:52px; height:52px; border-radius:50%; background:#49884F; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }

  /* timer card */
  .timer { border-radius:26px; padding:22px; text-align:center; position:relative; overflow:hidden; }
  .light .timer { background:#FBFAF7; } .dark .timer { background:#20261C; }
  .timer .lab { font-size:11px; letter-spacing:2px; font-weight:800; color:#8CA491; }
  .timer .num { font-family:'Nunito'; font-size:52px; font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums; margin:6px 0 4px; }
  .light .timer .num { color:#1E1E1E; } .dark .timer .num { color:#EFEFEF; }
  .timer .at { font-size:14px; font-weight:700; color:#49884F; } .dark .timer .at { color:#7FB98C; }
  .ticks { position:absolute; inset:0; }

  .rowcards { display:flex; gap:14px; }
  .card { flex:1; border-radius:22px; padding:16px 18px; }
  .light .card { background:#FBFAF7; } .dark .card { background:#20261C; }
  .card .ct { font-size:16px; font-weight:800; font-family:Georgia,serif; display:flex; align-items:center; gap:8px; }
  .card .cs { font-size:12.5px; margin-top:3px; } .light .cs { color:#7A7A72; } .dark .cs { color:#93A08C; }

  .signal { display:flex; align-items:center; gap:12px; border-radius:20px; padding:15px 18px; }
  .light .signal { background:#FBFAF7; } .dark .signal { background:#20261C; }
  .signal .st { font-size:14.5px; font-weight:700; } .signal b { color:#49884F; } .dark .signal b { color:#7FB98C; }

  .gap { height:16px; } .gapL { height:26px; }

  /* nav */
  .nav { position:absolute; left:20px; right:20px; bottom:26px; height:64px; border-radius:32px; display:flex; align-items:center; justify-content:space-around; z-index:2; }
  .light .nav { background:#FBFAF7; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  .dark .nav  { background:#20261C; }
  .nav .item { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:700; opacity:.55; }
  .nav .item.on { opacity:1; }
  .pill { padding:8px 22px; border-radius:22px; }
  .light .pill { background:#D1E6D3; } .dark .pill { background:#2E3A2C; }
  .ico { width:24px; height:24px; }
  h3.lbl { text-align:center; font-family:Georgia,serif; margin-bottom:16px; color:#4a4a44; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="orb" cx="45%" cy="57%" r="60%">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="30%" stop-color="#F4F9F0"/>
    <stop offset="60%" stop-color="#D9E8DB"/><stop offset="84%" stop-color="#B4D1BA"/><stop offset="100%" stop-color="#9EC0A6"/>
  </radialGradient>
  <radialGradient id="glowL" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#D6EBDA" stop-opacity=".9"/><stop offset="100%" stop-color="#D6EBDA" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowD" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#BFE0C8" stop-opacity=".55"/><stop offset="100%" stop-color="#BFE0C8" stop-opacity="0"/></radialGradient>
  <radialGradient id="spec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="bs" cx="50%" cy="80%" r="55%"><stop offset="0%" stop-color="#5E8568" stop-opacity="0"/><stop offset="72%" stop-color="#5E8568" stop-opacity="0"/><stop offset="100%" stop-color="#5E8568" stop-opacity=".3"/></radialGradient>
  <linearGradient id="sheenL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff" stop-opacity=".92"/><stop offset="46%" stop-color="#D8EADC" stop-opacity=".6"/><stop offset="100%" stop-color="#98BEA2" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="sheenD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff" stop-opacity=".06"/><stop offset="46%" stop-color="#CFE4D5" stop-opacity=".16"/><stop offset="100%" stop-color="#9EC7A9" stop-opacity=".12"/>
  </linearGradient>
  <filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft2" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.8"/></filter>
</defs></svg>

<script>
function orb(dark){ const sh = dark?'sheenD':'sheenL'; const gl = dark?'glowD':'glowL';
  const ro = dark ? [0.9,0.6,0.4] : [0.8,0.5,0.3];
  return `
  <circle cx="120" cy="122" r="98" fill="url(#${gl})" filter="url(#soft)"/>
  <g fill="none" stroke="url(#${sh})" filter="url(#soft2)">
    <circle cx="120" cy="120" r="72" stroke-width="11" opacity="${ro[0]}"/>
    <circle cx="120" cy="120" r="88" stroke-width="11" opacity="${ro[1]}"/>
    <circle cx="120" cy="120" r="104" stroke-width="11" opacity="${ro[2]}"/>
  </g>
  <circle cx="120" cy="120" r="56" fill="url(#orb)"/>
  <circle cx="120" cy="120" r="56" fill="url(#bs)"/>
  <ellipse cx="100" cy="94" rx="24" ry="15" fill="url(#spec)" filter="url(#soft2)" transform="rotate(-24 100 94)"/>
  <circle cx="98" cy="90" r="5" fill="#fff" opacity=".95" filter="url(#soft2)"/>
  <ellipse cx="108" cy="120" rx="5.5" ry="8.5" fill="#222f27"/><ellipse cx="132" cy="120" rx="5.5" ry="8.5" fill="#222f27"/>`;}

function ticks(dark){ let t=''; const cx=195,cy=76,rx=150,ry=56;
  for(let i=0;i<60;i++){ const a=(i/60)*2*Math.PI - Math.PI/2; const major=i%5===0;
    const r1=1, len=major?9:5; const x1=cx+Math.cos(a)*(rx), y1=cy+Math.sin(a)*(ry);
    const x2=cx+Math.cos(a)*(rx-len), y2=cy+Math.sin(a)*(ry-len);
    const active=i<14; const col=active?'#49884F':(dark?'#3a463a':'#D8D2C4');
    t+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${major?2.4:1.2}" stroke-linecap="round" opacity="${active?1:.5}"/>`;}
  return `<svg class="ticks" viewBox="0 0 390 152">${t}</svg>`;}

function screen(dark){
  const playIco = `<svg class="ico" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="#fff"/></svg>`;
  const st = dark?'#EFEFEF':'#1E1E1E';
  const chatIco = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${st}" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
  const regenIco = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${st}" stroke-width="2"><path d="M12 3l2 3 3-1M4 12a8 8 0 0 1 14-5m2 5a8 8 0 0 1-14 5"/></svg>`;
  const inboxIco = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#49884F" stroke-width="2"><path d="M4 4h16v12H4z"/><path d="M4 12h5a3 3 0 0 0 6 0h5"/></svg>`;
  return `
  <div class="statusbar"><span>9:41</span><span>&#9679;&#9679;&#9679; &#128246; 34</span></div>
  <div class="screen">
    <div class="hero">
      <svg viewBox="0 0 240 240">${orb(dark)}</svg>
      <div class="greet">Good morning, Chandan</div>
      <div class="sub">Your morning briefing is ready.</div>
    </div>

    <div class="gapL"></div>
    <div class="primary">
      <div><div class="t">Play today's briefing</div><div class="s">4 min &middot; 12 signals synthesized</div></div>
      <div class="pbtn">${playIco}</div>
    </div>

    <div class="gapL"></div>
    <div class="caption">Next briefing</div>
    <div class="timer">
      ${ticks(dark)}
      <div class="lab">COUNTDOWN</div>
      <div class="num">06:41:55</div>
      <div class="at">at 7:00 AM</div>
    </div>

    <div class="gapL"></div>
    <div class="caption">More</div>
    <div class="rowcards">
      <div class="card"><div class="ct">${chatIco} Ask Echo</div><div class="cs">Chat with your assistant</div></div>
      <div class="card"><div class="ct">${regenIco} Regenerate</div><div class="cs">Update the summary</div></div>
    </div>

    <div class="gap"></div>
    <div class="signal">${inboxIco}<div class="st"><b>59 signals</b> captured today</div></div>
  </div>
  <div class="nav">
    <div class="item on"><div class="pill"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="${dark?'#DDEAD9':'#16301B'}" stroke-width="2.2"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg></div><span>Today</span></div>
    <div class="item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H4z"/><path d="M4 12h5a3 3 0 0 0 6 0h5"/></svg><span>Vault</span></div>
    <div class="item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></div>
  </div>`;
}
document.write(`<div class="phone light">${screen(false)}</div>`);
</script>
</body>
</html>
