<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#C9C5BC; font-family:'Nunito',system-ui,sans-serif; padding:40px; display:flex; gap:44px; justify-content:center; align-items:flex-start; }
  .phone { width:390px; height:844px; border-radius:46px; overflow:hidden; position:relative;
           background:radial-gradient(130% 90% at 50% 34%, #1a2b1e 0%, #101810 46%, #0a0f09 100%);
           color:#EAF1E6; box-shadow:0 30px 80px rgba(0,0,0,.3); }
  .statusbar { position:absolute; top:20px; left:28px; right:28px; display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:#c2cebd; z-index:3; }
  .close { position:absolute; top:56px; right:22px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; z-index:3; }

  .stage { position:absolute; top:0; bottom:180px; left:0; right:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px; }
  .stage svg.orb { width:230px; height:230px; }
  .status { margin-top:20px; font-size:12px; letter-spacing:3px; font-weight:800; color:#83C193; }
  .say { margin-top:16px; text-align:center; font-family:Georgia,serif; font-size:25px; line-height:1.35; color:#F2F6EE; max-width:300px; }

  /* sources dropdown (speaking) */
  .sources { margin-top:20px; width:100%; max-width:330px; }
  .srcbtn { display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); border-radius:16px; padding:12px 16px; font-size:13.5px; font-weight:700; color:#bfeecb; }
  .srcbtn .chev { margin-left:2px; }
  .srclist { margin-top:8px; background:rgba(255,255,255,.05); border-radius:16px; padding:6px; }
  .srcitem { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:12px; }
  .srcitem + .srcitem { border-top:1px solid rgba(255,255,255,.06); }
  .srcitem .dot { width:26px; height:26px; border-radius:8px; background:rgba(127,185,140,.18); display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-top:1px; }
  .srcitem .m .s { font-size:13px; font-weight:800; color:#EAF1E6; }
  .srcitem .m .c { font-size:12px; color:#9fb0a0; margin-top:1px; line-height:1.35; }

  .control { position:absolute; bottom:52px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:14px; z-index:3; }
  .mic { width:76px; height:76px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .mic.live { background:#49884F; box-shadow:0 0 0 10px rgba(73,136,79,.14), 0 0 46px rgba(97,190,120,.55); }
  .mic.stop { background:rgba(255,255,255,.09); border:1.5px solid rgba(255,255,255,.22); }
  .hint { font-size:13px; color:#93a594; }
  h3.lbl { text-align:center; font-family:Georgia,serif; margin-bottom:16px; color:#4a4a44; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="orb" cx="45%" cy="57%" r="60%">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="30%" stop-color="#F4F9F0"/>
    <stop offset="60%" stop-color="#D9E8DB"/><stop offset="84%" stop-color="#B4D1BA"/><stop offset="100%" stop-color="#9EC0A6"/>
  </radialGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7FE0A0" stop-opacity=".5"/><stop offset="60%" stop-color="#5EC182" stop-opacity=".14"/><stop offset="100%" stop-color="#5EC182" stop-opacity="0"/></radialGradient>
  <radialGradient id="spec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="bs" cx="50%" cy="80%" r="55%"><stop offset="0%" stop-color="#4E7B5A" stop-opacity="0"/><stop offset="72%" stop-color="#4E7B5A" stop-opacity="0"/><stop offset="100%" stop-color="#41684c" stop-opacity=".32"/></radialGradient>
  <filter id="halB" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="ringB" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="4.5"/></filter>
  <filter id="soft2" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs></svg>

<script>
// soft, symmetric, GREEN glowing sonar rings — no white-topped sheen
function ring(r, op){ return `<circle cx="120" cy="120" r="${r}" fill="none" stroke="#8FE0A6" stroke-width="6" opacity="${op}" filter="url(#ringB)"/>`; }
function voiceOrb(state){
  let rings='';
  if(state==='idle') rings = ring(74,.5)+ring(94,.28);
  if(state==='listening') rings = ring(66,.6)+ring(84,.4)+ring(102,.22);   // converging
  if(state==='speaking') rings = ring(78,.55)+ring(100,.34)+ring(120,.18); // expanding
  let band='', front='';
  if(state==='thinking'){
    band = `<path d="M46 106 A 80 32 -16 0 1 194 138" fill="none" stroke="#8FE0A6" stroke-width="9" opacity=".45" filter="url(#ringB)"/>`;
    front = `<path d="M194 138 A 80 32 -16 0 1 46 106" fill="none" stroke="#AEECBF" stroke-width="9" opacity=".85" filter="url(#soft2)"/>`;
  }
  const eyes = (state==='thinking'||state==='speaking')
    ? `<g stroke="#233028" stroke-width="3" fill="none" stroke-linecap="round"><path d="M101 120 Q108 127 115 120"/><path d="M125 120 Q132 127 139 120"/></g>`
    : `<ellipse cx="108" cy="120" rx="5.5" ry="8.5" fill="#233028"/><ellipse cx="132" cy="120" rx="5.5" ry="8.5" fill="#233028"/>`;
  return `<circle cx="120" cy="122" r="100" fill="url(#halo)" filter="url(#halB)"/>${band}${rings}
    <circle cx="120" cy="120" r="52" fill="url(#orb)"/><circle cx="120" cy="120" r="52" fill="url(#bs)"/>
    <ellipse cx="102" cy="97" rx="22" ry="14" fill="url(#spec)" filter="url(#soft2)" transform="rotate(-24 102 97)"/>
    <circle cx="100" cy="93" r="4.5" fill="#fff" opacity=".95" filter="url(#soft2)"/>${eyes}${front}`;
}

const closeIco = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EAF1E6" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const micIco = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>`;
const stopIco = `<svg width="22" height="22" viewBox="0 0 24 24" fill="#EAF1E6"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>`;
const chev = `<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bfeecb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
const waveIco = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8FE0A6" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 6v12M20 10v4"/></svg>`;

const listening = `
  <div class="statusbar"><span>12:32</span><span>&#9679;&#9679;&#9679; &#128246; 25</span></div>
  <div class="close">${closeIco}</div>
  <div class="stage">
    <svg class="orb" viewBox="0 0 240 240">${voiceOrb('listening')}</svg>
    <div class="status">LISTENING</div>
    <div class="say">What’s on my schedule today?</div>
  </div>
  <div class="control"><div class="mic live">${micIco}</div><div class="hint">Tap to stop</div></div>`;

const speaking = `
  <div class="statusbar"><span>12:32</span><span>&#9679;&#9679;&#9679; &#128246; 25</span></div>
  <div class="close">${closeIco}</div>
  <div class="stage">
    <svg class="orb" viewBox="0 0 240 240">${voiceOrb('speaking')}</svg>
    <div class="status">SPEAKING</div>
    <div class="sources">
      <div class="srcbtn">${waveIco} 3 notifications used ${chev}</div>
      <div class="srclist">
        <div class="srcitem"><div class="dot">${waveIco}</div><div class="m"><div class="s">Calendar</div><div class="c">Standup — 10:00 AM · Meet link</div></div></div>
        <div class="srcitem"><div class="dot">${waveIco}</div><div class="m"><div class="s">Calendar</div><div class="c">Dentist appointment — 4:30 PM</div></div></div>
        <div class="srcitem"><div class="dot">${waveIco}</div><div class="m"><div class="s">Priya · Slack</div><div class="c">Shared the Q3 Figma links for review</div></div></div>
      </div>
    </div>
  </div>
  <div class="control"><div class="mic stop">${stopIco}</div><div class="hint">Tap to interrupt</div></div>`;

document.write(`
 <div><h3 class="lbl">Listening</h3><div class="phone">${listening}</div></div>
 <div><h3 class="lbl">Speaking · sources dropdown</h3><div class="phone">${speaking}</div></div>
`);
</script>
</body>
</html>
